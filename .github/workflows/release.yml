name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without v prefix
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate metadata and CI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/prepare-release.py --kind stable --require-main --version "$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "acceptance" and .conclusion == "success") | .id' | grep -q .
      - name: Enable Corepack for Yarn cache discovery
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn
      - name: Build and validate
        run: |
          corepack enable
          yarn install --immutable
          yarn typecheck
          yarn lint
          yarn build
          yarn test:coverage
          yarn npm audit --severity high
          yarn pack:release
          test -d dist && test -n "$(find dist -type f -print -quit)"
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/project-v${VERSION}.tar.gz" -C dist .
          cd release-artifacts
          sha256sum "project-v${VERSION}.tar.gz" > SHA256SUMS
          cd ..
          python3 scripts/release-notes.py --version "$VERSION" > release-artifacts/notes.md
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" release-artifacts/project-v"${VERSION}".tar.gz release-artifacts/SHA256SUMS --title "v${VERSION}" --notes-file release-artifacts/notes.md --verify-tag
