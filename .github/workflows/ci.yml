name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate bootstrap scripts and skills
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/validate-pr.py 'chore: validate bootstrap'
          python3 - <<'PY'
          import pathlib, tomllib
          for path in pathlib.Path('.codex').rglob('*.toml'):
              tomllib.loads(path.read_text())
          for path in pathlib.Path('.agents/skills').glob('*/SKILL.md'):
              text = path.read_text()
              assert text.startswith('---\nname: ') and '\ndescription: ' in text, path
          PY
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate-pr.py "$PR_TITLE"
      - name: Enable Corepack for Yarn cache discovery
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn
      - name: Install locked dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Typecheck, lint, build, test, audit
        run: |
          yarn typecheck
          yarn lint
          yarn build
          yarn test:coverage
          yarn npm audit --severity high
      - name: Enforce changed-line coverage
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if test -n "$PR_BASE"; then
            base="$PR_BASE"
          elif test -n "$PUSH_BASE" && test "$PUSH_BASE" != '0000000000000000000000000000000000000000'; then
            base="$PUSH_BASE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            echo 'Initial commit: no base for changed-line coverage'
            exit 0
          fi
          python3 scripts/check-coverage.py --base "$base"
